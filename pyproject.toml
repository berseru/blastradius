[project]
name = "blastradius"
version = "0.1.0"
description = "Supply-chain blast radius over a temporal dependency graph, built on HydraDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "berseru" }]
keywords = ["supply-chain", "npm", "graph", "hydradb", "osv", "security"]
dependencies = [
    "httpx>=0.28.1",
    "node-semver>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
blastradius = "blastradius.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blastradius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# zip(..., strict=) is not the point of this codebase's zips: the pairs it walks
# are built together a line or two above, so the check is noise here.
ignore = ["B905"]
