name: ci

# The steps live in ci/*.sh on purpose: the workflow file stays stable while the
# pipeline it runs can evolve with the code.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_packages:
        description: "How many seed packages to ingest"
        default: "250"
      scale:
        description: "Also run the scale-evidence job (slow)"
        default: "false"
      scale_levels:
        description: "Seed counts for the scale ladder"
        default: "143 300 600 1200"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash ci/unit.sh

  graph:
    name: integration against HydraDB
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The npm/OSV inputs are immutable per day, so a warm cache keeps the run
      # honest (same inputs) and fast (no re-download).
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: npm-data-${{ hashFiles('scripts/seed_packages.txt') }}-${{ github.run_id }}
          restore-keys: |
            npm-data-${{ hashFiles('scripts/seed_packages.txt') }}-
            npm-data-

      - name: Start HydraDB, ingest, run every query
        env:
          SEED_PACKAGES: ${{ github.event.inputs.seed_packages || '250' }}
        run: bash ci/graph.sh

      - name: HydraDB logs
        if: always()
        run: bash ci/collect-logs.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-artifacts
          path: artifacts/

  scale:
    name: scale evidence
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: npm-scale-${{ hashFiles('scripts/seed_packages_scale.txt') }}-${{ github.run_id }}
          restore-keys: |
            npm-scale-${{ hashFiles('scripts/seed_packages_scale.txt') }}-
            npm-scale-

      - name: Ingest and query a growing graph
        env:
          SCALE_LEVELS: ${{ github.event.inputs.scale_levels || '143 300 600 1200' }}
        run: bash ci/scale.sh

      - name: HydraDB logs
        if: always()
        run: bash ci/collect-logs.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-artifacts
          path: artifacts/scale/
